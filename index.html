    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme')
        if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
      // Low-end devices (little RAM, few cores or Save-Data on) get "lite" mode:
      // no WebGL scene, no smooth-scroll engine, no blur/grain effects.
      try {
        var n = navigator, c = n.connection || {}
        if (/[?&]lite/.test(location.search) || c.saveData || (n.deviceMemory && n.deviceMemory < 4) || (n.hardwareConcurrency && n.hardwareConcurrency < 4) || /2g/.test(c.effectiveType || ''))
          document.documentElement.classList.add('lite')
      } catch (e) {}
      // Deep links (#contact etc.) need real section heights to land in the right place,
      // so skip lazy section rendering for them.
      if (location.hash.length > 1) document.documentElement.classList.add('cv-off')
    </script>
